name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install with dev dependencies
        run: pip install docs/[dev]

      - name: Run tests
        run: pytest docs/tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: DeterminateSystems/nix-installer-action@v22

      # The registry publishes what it knows about itself here, so the
      # generator does not have to re-derive it by walking packages/*/data.json.
      # The manifest spans every advertised system, so this runs in the build
      # job and not in the test job, which stays pure Python on fixtures.
      - name: Evaluate the registry manifest
        run: nix eval --json .#manifest > docs/_manifest.json

      - name: Install docs package
        run: pip install --quiet docs/

      - name: Generate documentation
        run: python -m toolbox_docs --manifest docs/_manifest.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
