name: Registry check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      # `nix flake check --all-systems` evaluates the registry for every system
      # the flake advertises, not just the runner's. That is the point: building
      # all packages (cachix.yml) only ever gated x86_64-linux, so a bad hash or
      # a dangling pin on aarch64-linux/aarch64-darwin reached main unnoticed.
      # This is pure evaluation — seconds, no closure.
      #
      # --impure + the devenv-root override is what devenv needs to evaluate the
      # dev shell; the justfile's build-devshell recipe does the same.
      - name: nix flake check
        run: |
          printf '%s' "$PWD" > .devenv-root
          nix flake check --all-systems --impure \
            --override-input devenv-root "file+file://$PWD/.devenv-root"
